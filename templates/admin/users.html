{% extends "base.html" %}
{% block title %}조직원 관리{% endblock %}
{% block content %}
<div class="topbar">
  <h2>조직원 관리</h2>
  <span class="user-chip">{{ session.get('name') }}님 (관리자)</span>
</div>

<div class="toolbar">
  <div class="filters">
    <select id="filterDept"><option value="">전체 부서</option></select>
    <select id="filterStatus">
      <option value="">전체 상태</option>
      <option value="재직">재직</option>
      <option value="휴직">휴직</option>
      <option value="퇴사">퇴사</option>
    </select>
  </div>
  <button class="btn" id="btnNewUser">+ 조직원 등록</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>이름</th><th>부서</th><th>직급</th><th>이메일</th>
        <th>재직상태</th><th>사원증</th><th>권한상태</th><th>관리</th>
      </tr>
    </thead>
    <tbody id="userTableBody"></tbody>
  </table>
</div>

<div class="modal-backdrop" id="userModalBackdrop">
  <div class="modal">
    <h3 id="userModalTitle">조직원 등록</h3>
    <input type="hidden" id="userId">
    <label>아이디</label>
    <input type="text" id="f_username">
    <label>비밀번호 (수정 시 비워두면 유지)</label>
    <input type="password" id="f_password">
    <label>이름</label>
    <input type="text" id="f_name">
    <label>부서</label>
    <input type="text" id="f_department" placeholder="예: IT팀">
    <label>직급</label>
    <input type="text" id="f_position" placeholder="예: 사원">
    <label>이메일</label>
    <input type="text" id="f_email">
    <label>연락처</label>
    <input type="text" id="f_phone">
    <label>입사일</label>
    <input type="date" id="f_hire_date">
    <label>재직 상태</label>
    <select id="f_employment_status">
      <option value="재직">재직</option>
      <option value="휴직">휴직</option>
      <option value="퇴사">퇴사</option>
    </select>
    <div id="leaveFields" style="display:none;">
      <label>휴직 시작일</label>
      <input type="date" id="f_leave_start_date">
      <label>휴직 종료일</label>
      <input type="date" id="f_leave_end_date">
    </div>
    <div id="resignFields" style="display:none;">
      <label>퇴사일</label>
      <input type="date" id="f_resign_date">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="btnCancelUser">취소</button>
      <button class="btn" id="btnSaveUser">저장</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/users.js') }}"></script>
{% endblock %}
