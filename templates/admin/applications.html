{% extends "base.html" %}
{% block title %}사원증 신청 관리{% endblock %}
{% block content %}
<div class="topbar">
  <h2>사원증 신청 관리</h2>
  <span class="user-chip">{{ session.get('name') }}님 (관리자)</span>
</div>

<div class="toolbar">
  <div class="filters">
    <select id="filterStatus">
      <option value="">전체</option>
      <option value="pending">검토 대기</option>
      <option value="approved">승인됨(발급완료)</option>
      <option value="rejected">반려됨</option>
    </select>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>신청일</th><th>이름</th><th>사번</th><th>부서</th><th>직책</th><th>기타사항</th><th>상태</th><th>처리자</th><th>관리</th>
      </tr>
    </thead>
    <tbody id="applicationTableBody"></tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/applications.js') }}"></script>
{% endblock %}
