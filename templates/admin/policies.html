{% extends "base.html" %}
{% block title %}권한 정책 관리{% endblock %}
{% block content %}
<div class="topbar">
  <h2>부서·직급별 출입권한 정책</h2>
  <span class="user-chip">{{ session.get('name') }}님 (관리자)</span>
</div>

<div class="toolbar">
  <div></div>
  <button class="btn" id="btnNewPolicy">+ 정책 추가</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>부서</th><th>직급</th><th>구역</th><th>허용 여부</th><th>관리</th>
      </tr>
    </thead>
    <tbody id="policyTableBody"></tbody>
  </table>
</div>

<div class="modal-backdrop" id="policyModalBackdrop">
  <div class="modal">
    <h3>출입권한 정책 추가</h3>
    <label>부서</label>
    <input type="text" id="p_department" placeholder="예: IT팀">
    <label>직급</label>
    <input type="text" id="p_position" placeholder="예: 사원">
    <label>출입구역</label>
    <select id="p_area_id"></select>
    <label>허용 여부</label>
    <select id="p_allowed">
      <option value="true">허용</option>
      <option value="false">차단</option>
    </select>
    <div class="modal-actions">
      <button class="btn secondary" id="btnCancelPolicy">취소</button>
      <button class="btn" id="btnSavePolicy">저장</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/policies.js') }}"></script>
{% endblock %}
