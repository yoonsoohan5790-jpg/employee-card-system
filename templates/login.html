<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사원증 관리 시스템 - 로그인</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>사원증 관리 시스템</h1>
      <p class="sub">Employee Card &amp; Access Management</p>
      <div class="login-error" id="loginError"></div>
      <form id="loginForm">
        <input type="text" id="username" name="username" placeholder="아이디" autocomplete="username" required>
        <input type="password" id="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
        <button type="submit">로그인</button>
      </form>
      <div class="login-hint">
        관리자: admin / admin123<br>
        조직원 예시: hong / pass1234
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorBox.textContent = data.error || '로그인에 실패했습니다.';
          return;
        }
        window.location.href = data.redirect;
      } catch (err) {
        errorBox.textContent = '서버와 통신할 수 없습니다.';
      }
    });
  </script>
</body>
</html>
